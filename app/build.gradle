plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.saudi_anpr'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.saudi_anpr"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.2-one-scan"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Phone testing uses a separate Firebase license so the real reseller
            // license cannot accidentally become bound to the test phone.
            buildConfigField "String", "LICENSE_ID", '"SAUDI-TEST-001"'
        }
        release {
            // Production/reseller build uses the real Firebase license.
            minifyEnabled false
            buildConfigField "String", "LICENSE_ID", '"SAUDI-RESELLER-001"'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout

    // Existing ANPR camera stack
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Existing networking
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Existing maps dependency used by the current M400 build.
    implementation('com.google.android.gms:play-services-maps:9.8.0') {
        exclude group: 'com.android.support', module: 'support-v4'
    }

    // Existing EXIF support
    implementation "androidx.exifinterface:exifinterface:1.3.6"

    // Firebase: server-authoritative reseller license validation for project anpr-eef87.
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Phone QR scanner fallback: bundled ML Kit model, so scanning works immediately
    // after install without waiting for a model download.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Vuzix M400 built-in QR scanner + voice command engine.
    // These are resolved from Vuzix's JitPack-hosted binary artifacts.
    implementation 'com.vuzix:sdk-barcode:2.0.0'
    implementation 'com.vuzix:sdk-speechrecognitionservice:1.98.0'

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
